# Copy to .github/workflows/deploy-production.yml when ready to publish.
# This template is inert in production/. Manual dispatch only; no automatic push deploy.
name: Deploy Liwu production
on:
  workflow_dispatch:
    inputs:
      require_empty:
        description: First launch requires Gifts and Gallery counts to be zero
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: liwu-production-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Install pinned build dependencies
        run: npm ci
      - name: Write public production configuration
        env:
          LIWU_URL: ${{ vars.LIWU_PRODUCTION_SUPABASE_URL }}
          LIWU_PUBLIC_KEY: ${{ vars.LIWU_PRODUCTION_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          if(!process.env.LIWU_URL||!process.env.LIWU_PUBLIC_KEY)throw Error('Missing public production variables');
          await writeFile('production/frontend-config.json',JSON.stringify({mode:'supabase',environment:'production',mediaEnabled:true,moderationEnabled:true,basePath:'/',siteUrl:'https://riwoo1022.com',supabaseUrl:process.env.LIWU_URL,publishableKey:process.env.LIWU_PUBLIC_KEY}));
          JS
      - name: Build and validate production
        env:
          LIWU_PAGES_BASE: ${{ vars.LIWU_PAGES_BASE }}
          LIWU_REQUIRE_EMPTY: ${{ inputs.require_empty }}
        run: |
          test -n "$LIWU_PAGES_BASE"
          node tools/build-pages.mjs --config-file=production/frontend-config.json --out=site-dist --base="$LIWU_PAGES_BASE" --require-empty="$LIWU_REQUIRE_EMPTY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
